<nav class="navbar navbar-expand-lg navbar-dark custom-navbar sticky-top shadow-sm">
  <div class="container">

    <a class="navbar-brand d-flex align-items-center gap-2 brand-logo" routerLink="/" (click)="cerrarMenu()">
      <img
        src="imag/logo-rebanaditas.png"
        alt="Logo Rebanaditas"
        width="50"
        height="50"
        class="brand-logo-img rounded-circle shadow-sm"
      >
      <span class="brand-text">Rebanaditas</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#menuRebanaditas"
      aria-controls="menuRebanaditas"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuRebanaditas" #menuCollapse>
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">

        <li class="nav-item">
          <a class="nav-link nav-link-custom" routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}" (click)="cerrarMenu()">
            Inicio
          </a>
        </li>

        <!-- Enlace que lleva a la sección donde se presenta información del negocio -->
        <li class="nav-item">
          <a class="nav-link nav-link-custom" routerLink="/nosotros" routerLinkActive="active-link" (click)="cerrarMenu()">
            Nosotros
          </a>
        </li>

        <!-- Enlace para entrar al apartado donde se muestran los productos -->
        <li class="nav-item">
          <a class="nav-link nav-link-custom" routerLink="/productos" routerLinkActive="active-link" (click)="cerrarMenu()">
            Productos
          </a>
        </li>

        <!-- Este enlace lleva directamente a la sección de contacto de la página de inicio -->
        <li class="nav-item">
          <a class="nav-link nav-link-custom" routerLink="/" fragment="contacto-seccion" (click)="irAContacto($event)">
            Contáctanos
          </a>
        </li>

        <!-- Esta sección cambia dependiendo de si el usuario inició sesión o no -->
        <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
          @if (authService.isAuthenticated()) {
            <!-- Si ya hay una sesión iniciada, se muestra el nombre del usuario. -->
            <a
              routerLink="/login"
              class="badge bg-light text-dark fw-semibold px-3 py-2 rounded-pill border text-decoration-none shadow-sm"
              title="Ver perfil / Cerrar sesión"
              (click)="cerrarMenu()"
            >
              {{ authService.username() }}
            </a>
          } @else {
            <!-- Si todavía no hay una sesión iniciada, se muestra el botón para iniciar sesión -->
            <a class="btn btn-login px-3 py-1 rounded-pill fw-semibold shadow-sm" routerLink="/login" (click)="cerrarMenu()">
              Iniciar Sesión
            </a>
          }
        </li>

      </ul>
    </div>

  </div>
</nav>
